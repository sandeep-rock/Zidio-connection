# Application Configuration
spring.application.name=klu-music
server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/klumusic
spring.datasource.username=admin
spring.datasource.password=Admin123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create

# Expose actuator endpoints
management.endpoints.web.exposure.include=health,info,mappings



# Spring Security Default User (Basic Auth)

spring.security.user.name=admin
spring.security.user.password=Admin123!

# H2 Console (for development/testing only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration
jwt.secret=kluMusicSecretKeyForJWTTokenGeneration2024KLUUniversity
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Levels
logging.level.com.klumusic=DEBUG
logging.level.org.springframework.security=DEBUG

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
   #

management.endpoint.health.probes.enabled=true
   
spring.cloud.compatibility-verifier.enabled=false


spring.cloud.discovery.enabled=false
eureka.client.enabled=false

   